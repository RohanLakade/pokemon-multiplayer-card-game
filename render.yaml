# Render Blueprint: only the game server lives on Render now.
# The website is hosted on Vercel (see vercel.json).
services:
  # The game server: REST (Express) and WebSockets (Socket.IO) on one port
  - type: web
    name: pokemon-card-battle-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace @pokemon-game/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # The only website allowed to call the API: your Vercel address, with no trailing slash.
      # CHANGE THIS to your real Vercel address after step 3.
      - key: https://pokemon-multiplayer-card-game.vercel.app/
        value: https://pokemon-card-battle.vercel.app
      # One proxy (Render's) sits in front of the server: needed for real visitor IP addresses
      - key: TRUST_PROXY
        value: 1
