# Render Blueprint: describes both services, so one click creates them.
services:
  # The game server: REST (Express) and WebSockets (Socket.IO) on one port
  - type: web
    name: pokemon-card-battle-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace @pokemon-game/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # The only website allowed to call the API. Change it if your static site URL differs.
      - key: CLIENT_ORIGIN
        value: https://pokemon-card-battle.onrender.com
      # One proxy (Render's) sits in front of the server: needed for real visitor IP addresses
      - key: TRUST_PROXY
        value: 1

  # The website: only files, served from Render's CDN
  - type: web
    name: pokemon-card-battle
    runtime: static
    buildCommand: npm install && npm run build --workspace @pokemon-game/client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Baked into the JavaScript at build time. Public by design: never put a secret here.
      - key: VITE_SERVER_URL
        value: https://pokemon-card-battle-api.onrender.com
    routes:
      # Every path that is not a real file serves the app, so /lobby/ABC234 works after a refresh
      - type: rewrite
        source: /*
        destination: /index.html
